<mat-form-field>
  <mat-label>Reference</mat-label>

  <input
    matInput
    [(ngModel)]="reference"
    name="reference"
    [matAutocomplete]="auto"
    (keyup)="updateValue($event)"
  />
  <mat-autocomplete
    autoActiveFirstOption
    #auto="matAutocomplete"
    (optionSelected)="optionSelected($event)"
  >
    @for (monster of filteredMonsters | async; track $index) {
      <mat-option [value]="monster.reference"
        >{{ monster.reference }} {{ monster.name }}</mat-option
      >
    }
  </mat-autocomplete>
  <span matTextSuffix>{{ monster?.name }}</span>
</mat-form-field>
